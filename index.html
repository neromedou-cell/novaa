<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA AI</title>
    <meta
      name="description"
      content="NOVA AI — مساعد ذكاء اصطناعي شامل للمحادثة، البرمجة، البحث بالويب، التعليم، تحليل الصور والملفات، والصوت."
    />
    <meta property="og:title" content="NOVA AI" />
    <meta
      property="og:description"
      content="NOVA AI — مساعد ذكاء اصطناعي شامل للمحادثة، البرمجة، البحث بالويب، التعليم، تحليل الصور والملفات، والصوت."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('nova_theme') || localStorage.getItem('zill_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var savedLang = localStorage.getItem('nova_lang') || localStorage.getItem('zill_lang');
          if (savedLang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F9FA] text-slate-900 dark:bg-[#0B1120] dark:text-slate-100 antialiased selection:bg-teal-600/20 selection:text-teal-900 dark:selection:text-teal-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
